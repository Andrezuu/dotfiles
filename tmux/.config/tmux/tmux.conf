# --- COLORES Y ESTÉTICA ---
set -g default-terminal "xterm-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"
set -g status-bg "#bd93f9"
set -g status-fg "black"

# Asegurar que Zsh sea el shell por defecto
# set-option -g default-shell usr/bin/zsh

# --- USABILIDAD ---
# Cambiar el "Prefix" a Ctrl+a
unbind C-b
set-option -g prefix C-a
bind C-a send-prefix  # <--- AQUÍ: cambiamos bind-option por bind

# Habilitar el mouse
set -g mouse on

# Numeración de ventanas y paneles en 1
set -g base-index 1
setw -g pane-base-index 1

# Recargar configuración con 'Prefix + r'
# <--- AQUÍ: corregimos la ruta a .config
bind r source-file ~/.config/tmux/tmux.conf \; display "¡Configuración recargada!"

# Enable vi keybindings in copy mode
set-window-option -g mode-keys vi

# Use 'v' to begin selection (like Vim)
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Copy selection to system clipboard using xclip (X11)
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
